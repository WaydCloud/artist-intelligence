name: ip-probe

# 러너 IP에서 수집 소스가 열리는지만 잰다 (HANDOFF 3단계 · DRAFT-saas-platform.md §2.2.1).
#
# 왜 이게 있나: 수집을 GitHub Actions로 옮길 수 있는지가 여기서 갈린다. Kworb 스크레이프와
# 국가별 차트는 지역 차단·레이트리밋의 표면이 넓고, **데이터센터 IP에서 지금처럼 응답하는지는
# 로컬에서 잴 수 없다.** 10분짜리 실행 하나가 이전 결정 전체를 가른다 — 막히면 Actions는
# 후보에서 빠지고 Modal(D-003)로 간다.
#
# 🔴 수동 트리거 전용이다. push/schedule을 달지 않는다 — 이건 상시 검사가 아니라 **한 번
#    보고 버리는 시험**이고, 소스를 매 푸시마다 때릴 이유가 없다.
# 🔴 아무것도 저장하지 않는다. 응답은 길이만 세고 버린다(scripts/ip_probe.py).
# 🔴 돈을 쓰지 않는다. Apify는 토큰·플랜 조회뿐이고 액터를 돌리지 않는다.
#
# 판정하지 않으므로 언제나 초록으로 끝난다. **읽을 것은 종료 상태가 아니라 요약 표**이고,
# 로컬 기준선(`python scripts/ip_probe.py`)과 나란히 놓고 봐야 뜻이 선다.
#
# 결정이 나면 이 파일과 scripts/ip_probe.py는 지워도 된다.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "which runner to probe from"
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - windows-latest

permissions:
  contents: read

jobs:
  probe:
    name: reachability from a GitHub-hosted runner
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 키가 없으면 그 두 항목은 skip 으로 표시된다 -- 통과가 아니다. 무료 스크레이프
      # 소스(Kworb / Apple RSS / iTunes)는 키 없이도 재지므로 그것만으로도 답이 나온다.
      - name: Probe
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/ip_probe.py --json probe.json
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## ip-probe — ${{ inputs.runner }}'
            echo '```json'
            cat probe.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # 아티팩트로도 남긴다 -- 로컬 기준선과 나란히 놓고 봐야 뜻이 선다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ip-probe-${{ inputs.runner }}
          path: probe.json
          retention-days: 7

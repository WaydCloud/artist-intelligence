name: secret scan (full history)

# 왜 별도 워크플로인가 — ci.yml의 secret scan은 **증분만** 본다.
#
# gitleaks-action은 트리거 이벤트의 커밋 범위를 스캔한다. 실측(2026-07-29):
#   PR(3커밋) → `3 commits scanned`
#   squash 머지 후 main push(1커밋) → `1 commits scanned · ~23.6KB`
# 즉 `fetch-depth: 0`을 넣어 증분 스캔을 되살린 뒤에도 **과거 이력은 아무도 읽지 않는다.**
# (같은 시점 로컬에서 전체를 훑으면 `23 commits · 10.64MB` — 증분의 450배다.)
#
# schedule / workflow_dispatch 이벤트에서는 전체 이력을 훑으므로 그 경로를 여기 따로 판다.
# ci.yml의 `on:`에 얹지 않는 이유는 그러면 주기 실행마다 5개 잡이 전부 도는 낭비이기 때문이다.
#
# 기준선(2026-07-29, gitleaks 8.24.3 로컬 전체 스캔): 23커밋 클린. 여기가 빨개지면
# **새로 들어온 것**이거나 룰셋이 넓어진 것이다 — 둘 다 사람이 봐야 한다.

on:
  schedule:
    - cron: "0 18 * * 0" # 매주 일요일 18:00 UTC = 월요일 03:00 KST
  workflow_dispatch: # 손으로 돌려 확인할 수 있게 열어둔다

jobs:
  full:
    name: gitleaks (entire history)
    runs-on: ubuntu-latest
    steps:
      # 전체 이력을 봐야 하므로 여기서도 shallow clone이면 안 된다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan — full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

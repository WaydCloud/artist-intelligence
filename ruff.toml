# ruff 설정 정본 — 레포 전체(modules/ · scripts/)에 적용된다.
#
# 이 파일이 존재해야 하는 이유는 세 가지다.
#
# 1) target-version 통일.
#    ruff는 설정이 없으면 가장 가까운 pyproject.toml의 `requires-python`으로
#    타깃을 추론한다. chart-history·fandom-pulse에만 pyproject.toml이 있어
#    그 둘만 py311로 추론되고 sonic-profile·signal-bridge·yt-pulse는
#    기본값을 쓰고 있었다 — 같은 레포인데 모듈마다 판정 기준이 달랐다.
#
# 2) 설정 탐색을 여기서 멈춘다.
#    루트에 설정이 없으면 ruff는 상위 디렉터리와 사용자 전역 설정
#    (%APPDATA%\ruff\ruff.toml 등)까지 거슬러 올라간다. 그러면 개발자 PC마다
#    린트 결과가 달라지고 CI에서는 재현되지 않는다.
#
# 3) 린트 정책을 한 곳에서 읽게 한다.
#
# ── 규칙 세트에 대하여 ──────────────────────────────────────────────
# `select`를 명시하지 않고 ruff의 선별 기본값(0.16.0 기준 413규칙)을 그대로 탄다.
# 대신 **버전을 핀한다**(.github/workflows/ci.yml의 RUFF_VERSION).
#
# 핀이 본질이다. 0.15.22의 기본값은 E+F(118규칙)뿐이었는데 0.16.0에서
# 413규칙으로 넓어졌고, 그 때문에 우리 커밋과 무관하게 CI가 적색이 됐다.
# 413개를 여기 나열하는 방법도 있으나 유지가 불가능하고 업스트림 개선을
# 못 받는다. 버전을 고정하면 기본값 변화는 "버전을 올리는 커밋"에서만
# 일어나므로 검토 가능한 사건이 된다.
#
# 규칙을 더하거나 빼려면 아래 extend-select / ignore에 **근거와 함께** 적는다.

target-version = "py311"

[lint]
# 기본값에서 빼는 규칙. 각 항목은 근거를 단다.
ignore = []

# 기본값에 더하는 규칙. 각 항목은 근거를 단다.
#
# S310(urlopen 스킴 감사)은 켜지 않는다 — `urlopen`뿐 아니라 `Request(...)`
# 생성자까지 지적하는데, Request 생성만으로는 아무것도 열리지 않아 절반이
# 현학적이다. 네트워크 호출부의 신뢰 근거는 호출부 주석으로 남긴다.
extend-select = []
